services:
  database:
    container_name: HR-DATABASE
    image: postgres:15
    environment:
      # Values below are development defaults.
      # Override in production by setting these variables in your environment or a .env file.
      POSTGRES_DB: ${POSTGRES_DB:-hrSolution}
      POSTGRES_USER: ${POSTGRES_USER:-hrSolutionUser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrSolutionPWD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
